name: digital_warranty_manager
description: A professional Flutter application for managing product warranties, receipts, and expiry reminders.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.13.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Google Fonts
  google_fonts: ^6.3.2

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Date & Time
  intl: ^0.19.0



  # Image Picker
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # App launcher icon
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/categories/
    - assets/images/placeholders/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/app_icon.png"

  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icons/app_icon.png"